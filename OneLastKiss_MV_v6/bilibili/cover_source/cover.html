<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">
<title>One Last Kiss — cover</title>
<!--
  B站封面排版：?r=169 (1920x1080, 底图 keyart_16x9.png) | ?r=43 (1440x1080, 底图 keyart_4x3.png)
  AI 生图作底图 + 网页排版 + canvas 绘制 RGB 线条（精密环、轨道透视线、节拍标尺）
-->
<style>
:root{color-scheme:dark;--cy:#2ee0ff;--mg:#ff2bb8;--yel:#ffd400;--red:#e8141e;--paper:#f3f1ea}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#000;overflow:hidden}
#c{position:relative;overflow:hidden;background:#000}
#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(1.06) contrast(1.04)}
.grade{position:absolute;inset:0;pointer-events:none}
canvas{position:absolute;inset:0}
.blk{position:absolute;color:var(--paper)}
.kick{font:600 25px/1 'TeX Gyre Heros Cn','Liberation Sans Narrow',sans-serif;letter-spacing:.32em;display:flex;align-items:center;gap:16px;opacity:.92}
.kick i{display:inline-block;width:16px;height:16px;background:var(--red)}
.kick b{font-weight:600;color:var(--cy)}
.title{font-family:'Noto Serif CJK JP',serif;font-weight:700;color:#fff;transform-origin:0 0;white-space:nowrap;
  text-shadow:-4px 0 rgba(46,224,255,.85),4px 0 rgba(255,43,184,.85),0 0 42px rgba(255,120,60,.55),0 6px 30px rgba(0,0,0,.6)}
.artist{font:400 54px/1 'Noto Serif CJK JP',serif;letter-spacing:.24em;display:flex;align-items:center;gap:26px}
.artist span{font:600 24px/1 'TeX Gyre Heros Cn',sans-serif;letter-spacing:.3em;opacity:.75}
.hook{display:flex;flex-direction:column;align-items:flex-start;gap:10px;font:700 66px/1 'Noto Sans CJK SC',sans-serif;color:#0b0b0b}
.hook .row{display:inline-flex;align-items:stretch;box-shadow:0 10px 40px rgba(0,0,0,.45)}
.hook .y{background:var(--yel);padding:18px 30px 20px}
.hook .r{background:var(--red);width:22px}
.sub{font:400 28px/1.3 'Noto Sans CJK SC',sans-serif;letter-spacing:.08em;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.8)}
.sub em{font-style:normal;color:var(--cy);margin:0 .35em}
.ver{position:absolute;font:600 26px/1 'TeX Gyre Heros Cn',sans-serif;letter-spacing:.28em;color:#fff;border:2px solid rgba(255,255,255,.85);padding:12px 16px 11px 20px;background:rgba(0,0,0,.35)}
.ver b{color:var(--yel)}
.plate{background:rgba(0,0,10,.62);border-left:4px solid var(--red);padding:9px 14px 8px 12px;color:#fff!important}
.tc{position:absolute;font:500 19px/1 'Noto Sans Mono','DejaVu Sans Mono',monospace;letter-spacing:.12em;color:rgba(255,255,255,.72)}
</style></head>
<body>
<div id="c">
  <img id="bg" alt="">
  <div class="grade" id="g"></div>
  <canvas id="cv"></canvas>
  <div class="blk" id="txt">
    <div class="kick"><i></i>EVANGELION:3.0+1.0 <b>/</b> THEME SONG</div>
    <div class="title" id="ttl"></div>
    <div class="artist">宇多田ヒカル<span>HIKARU UTADA</span></div>
    <div id="hk" class="hook"></div>
    <div class="sub" id="sub">程序化3D<em>/</em>RGB线条<em>/</em>逐拍踩点<em>/</em>中日英三语字幕<em>/</em>2K60</div>
  </div>
  <div class="ver" id="ver">WEB MV <b>VER.6</b></div>
  <div class="tc" id="tc">T+000.000s　♩=112　BAR 001</div>
  <div class="tc" id="lb1"></div><div class="tc" id="lb2"></div>
</div>
<script>
const Q = new URLSearchParams(location.search);
const R = Q.get('r') || '169', W = R === '43' ? 1440 : 1920, H = 1080;
// focal point = the glass-marble Earth, in image uv (0..1) + its radius as a fraction of image height
const F = R === '43' ? { img: 'keyart_4x3.png', u: 0.506, v: 0.62, r: 0.118 } : { img: 'keyart_16x9.png', u: 0.593, v: 0.49, r: 0.158 };
const c = document.getElementById('c'); c.style.width = W + 'px'; c.style.height = H + 'px';
const bg = document.getElementById('bg'); bg.src = Q.get('img') || F.img;
document.getElementById('g').style.background =
  'linear-gradient(90deg,rgba(0,0,8,.82) 0%,rgba(0,0,8,.55) 26%,rgba(0,0,8,0) 50%),' +
  'linear-gradient(0deg,rgba(0,0,8,.5) 0%,rgba(0,0,8,0) 20%),linear-gradient(180deg,rgba(0,0,8,.45) 0%,rgba(0,0,8,0) 15%)';

// ---- layout per ratio
const txt = document.getElementById('txt'), ttl = document.getElementById('ttl');
const L = R === '43'
  ? { x: 70, y: 104, size: 150, lines: ['One Last', 'Kiss'], sx: .86, gap: [30, 26, 38, 26], hook: 52, sub: 24, roman: 0,
      hookTxt: ['Claude Opus 5.5', '网页 MV 制作测试'], subTxt: '网页实时渲染<em>/</em>逐拍踩点<br>中日英三语字幕<em>/</em>2K60' }
  : { x: 104, y: 108, size: 178, lines: ['One Last', 'Kiss'], sx: .86, gap: [28, 28, 40, 26], hook: 58, sub: 28,
      roman: 1, hookTxt: ['Claude Opus 5.5', '网页 MV 制作测试'], subTxt: '网页实时渲染<em>/</em>逐拍踩点<em>/</em>中日英三语字幕<em>/</em>2K60' };
txt.style.left = L.x + 'px'; txt.style.top = L.y + 'px';
ttl.innerHTML = L.lines.join('<br>'); ttl.style.fontSize = L.size + 'px'; ttl.style.lineHeight = '1.0';
ttl.style.transform = `scaleX(${L.sx})`; ttl.style.height = (L.size * L.lines.length) + 'px';
ttl.style.marginTop = L.gap[0] + 'px';
document.querySelector('.artist').style.marginTop = L.gap[1] + 'px';
const hk = document.getElementById('hk'); hk.style.marginTop = L.gap[2] + 'px'; hk.style.fontSize = L.hook + 'px';
hk.innerHTML = L.hookTxt.map(t => `<div class="row"><span class="y">${t}</span><span class="r"></span></div>`).join('');
if (!L.roman) document.querySelector('.artist span').remove();
const sub = document.getElementById('sub'); sub.style.marginTop = L.gap[3] + 'px'; sub.style.fontSize = L.sub + 'px'; sub.innerHTML = L.subTxt;
const ver = document.getElementById('ver'); ver.style.right = '56px'; ver.style.top = '52px';
const tc = document.getElementById('tc'); tc.style.left = L.x + 'px'; tc.style.top = '46px';

// ---- RGB line drawing
const cv = document.getElementById('cv'); cv.width = W; cv.height = H;
const g = cv.getContext('2d');
const CY = '46,224,255', MG = '255,43,184', WH = '235,245,255', RD = '255,40,60';
function line(x1, y1, x2, y2, col, a, w) { g.strokeStyle = `rgba(${col},${a})`; g.lineWidth = w || 1.5; g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); }
function glow(fn, col, blur) { g.save(); g.shadowColor = `rgba(${col},0.95)`; g.shadowBlur = blur; fn(); g.restore(); }
function ell(r, k, rot, col, a, w, a0 = 0, a1 = Math.PI * 2) {   // tilted orbit ellipse
  g.save(); g.rotate(rot); g.strokeStyle = `rgba(${col},${a})`; g.lineWidth = w; g.beginPath(); g.ellipse(0, 0, r, r * k, 0, a0, a1); g.stroke(); g.restore();
}

bg.onload = () => {
  const iw = bg.naturalWidth, ih = bg.naturalHeight, s = Math.max(W / iw, H / ih);
  const dw = iw * s, dh = ih * s, ox = (W - dw) / 2, oy = (H - dh) / 2;
  const fx = ox + F.u * dw, fy = oy + F.v * dh, fr = F.r * dh;
  g.globalCompositeOperation = 'lighter';

  // 1) orbits around the glass-marble Earth: RGB-split tilted ellipses, front halves brighter
  g.save(); g.translate(fx, fy);
  const orb = [[1.38, .24, -0.36, CY], [1.5, .2, -0.33, MG]];
  for (const [m, k, rot, col] of orb) {
    glow(() => ell(fr * m, k, rot, col, .22, 1.2, Math.PI, Math.PI * 2), col, 6);     // back half (behind the marble)
    glow(() => ell(fr * m, k, rot, col, .8, 2, 0, Math.PI), col, 14);                  // front half
  }
  // lock-on ring: tick ring (112 ticks = 112 BPM) + bracket arcs
  const r0 = fr * 1.2;
  for (let i = 0; i < 112; i++) {
    const a = i / 112 * Math.PI * 2, l = i % 8 === 0 ? 14 : i % 4 === 0 ? 8 : 4;
    if (a > 0.35 && a < 1.25) continue;    // gap where the label leader leaves
    line(Math.cos(a) * r0, Math.sin(a) * r0, Math.cos(a) * (r0 + l), Math.sin(a) * (r0 + l), WH, i % 8 ? .3 : .75, 1);
  }
  glow(() => { g.strokeStyle = `rgba(${CY},.95)`; g.lineWidth = 3.5; g.beginPath(); g.arc(0, 0, r0 - 10, -2.4, -1.35); g.stroke();
               g.beginPath(); g.arc(0, 0, r0 - 10, 2.0, 2.6); g.stroke(); }, CY, 16);
  glow(() => { g.strokeStyle = `rgba(${RD},.9)`; g.lineWidth = 3.5; g.beginPath(); g.arc(0, 0, r0 - 10, -0.5, -0.1); g.stroke(); }, RD, 14);
  // leader line to the label
  const la = 0.8, lx = Math.cos(la) * (r0 + 6), ly = Math.sin(la) * (r0 + 6);
  line(lx, ly, lx + 60, ly + 60, WH, .8, 1.3); line(lx + 60, ly + 60, lx + 250, ly + 60, WH, .8, 1.3);
  g.restore();
  const lb1 = document.getElementById('lb1'), lb2 = document.getElementById('lb2');
  lb1.textContent = 'TARGET : EARTH'; lb2.textContent = 'Ø 12,742 km ≒ 16 mm';
  const bx = fx + lx + 66, by = fy + ly + 60;
  lb1.className = lb2.className = 'tc plate';
  lb1.style.left = bx + 'px'; lb1.style.top = (by - 40) + 'px';
  lb2.style.left = bx + 'px'; lb2.style.top = (by + 4) + 'px'; lb2.style.borderLeftColor = 'var(--cy)';

  // 2) beat ruler along the top edge (32 beats = 8 bars)
  const y0 = 80, x0 = L.x, x1 = W - 56;
  line(x0, y0, x1, y0, WH, .35, 1);
  for (let i = 0; i <= 32; i++) {
    const x = x0 + (x1 - x0) * i / 32, big = i % 4 === 0;
    line(x, y0, x, y0 + (big ? 16 : 7), big ? CY : WH, big ? .9 : .45, big ? 2 : 1);
  }
  // 3) RGB scanlines behind the title block: three offset hairlines sweeping in from the left edge
  const ty = L.y + L.gap[0] + 25 + L.size * L.lines.length + 8;
  glow(() => line(0, ty, W * (R === '43' ? .4 : .38), ty, CY, .7, 1.5), CY, 8);
  glow(() => line(0, ty + 5, W * (R === '43' ? .33 : .31), ty + 5, MG, .6, 1.5), MG, 8);

  // 4) crop marks
  const cm = (x, y, dx, dy) => { line(x, y, x + dx * 34, y, WH, .7, 2); line(x, y, x, y + dy * 34, WH, .7, 2); };
  cm(28, 28, 1, 1); cm(W - 28, 28, -1, 1); cm(28, H - 28, 1, -1); cm(W - 28, H - 28, -1, -1);
  document.body.dataset.ready = '1';
};
</script>
</body></html>
